name: tests
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline portability check and unit tests
        run: bash scripts/port-check.sh
